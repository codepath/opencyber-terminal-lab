# Run-smoke config for the Terminal + SSH lab (consumed by ../_smoke-test.sh, rubric TECH-4).
# Probe = the lab's core skill: use a handed key to SSH into a server passwordlessly.
PROBE_CMD='ssh -i ~/keys/webadmin_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new webadmin@localhost whoami'
PROBE_EXPECT='webadmin'
# Self-labeling spoiler filenames must never come back.
BANNED_EXTRA='\.suspicious'
